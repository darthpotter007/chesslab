<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChessLab</title>
<style>:root{
  --bg:#141413;--s1:#1c1c1a;--s2:#24241f;--s3:#2e2e29;--line:#383835;
  --t1:#f0efec;--t2:#c3c2b7;--t3:#8f8e86;
  --acc:#5aa86a;--acc2:#3e8a50;
  --win:#0ca30c;--draw:#8f8e86;--loss:#d03b3b;
  --c-brilliant:#26c2a3;--c-great:#5b8baf;--c-best:#7fb33e;--c-excellent:#7fb33e;--c-good:#94ae86;
  --c-book:#a88865;--c-inaccuracy:#e8b43c;--c-mistake:#e58f2a;--c-miss:#ee6b55;--c-blunder:#d03b3b;--c-forced:#8f8e86;
  --light:#eeeed2;--dark:#769656;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:#7fb6e8}
button{font:inherit;color:inherit}
.btn{background:var(--s3);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#3a3a34}
.btn.primary{background:var(--acc2);border-color:var(--acc)}
.btn.primary:hover{background:var(--acc)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
input,select{font:inherit;color:var(--t1);background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus,select:focus{outline:2px solid var(--acc2);outline-offset:0}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 20px;background:#11110f;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:17px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.logo span{color:var(--acc)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{color:var(--t2);text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600}
nav a:hover{background:var(--s2);color:var(--t1)}
nav a.on{background:var(--s3);color:var(--t1)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--t2);font-size:13px}
.pill{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--t2);display:inline-flex;gap:6px;align-items:center}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
main{max-width:1320px;margin:0 auto;padding:20px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.muted{color:var(--t3)} .t2{color:var(--t2)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.tile .v{font-size:26px;font-weight:800;line-height:1.1}
.tile .l{color:var(--t2);font-size:12.5px;margin-top:2px}
.tile .s{color:var(--t3);font-size:12px;margin-top:4px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--t2);font-weight:600;font-size:12.5px}
.chip.on{background:var(--acc2);border-color:var(--acc);color:#fff}
.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:0 0 16px;padding:10px 14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.filters label{color:var(--t3);font-size:12px;font-weight:600;text-transform:uppercase;margin-right:4px}
/* WDL bars */
.wdl-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr 92px;gap:10px;align-items:center;padding:4px 0}
.wdl-row .lab{color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdl-row .lab small{color:var(--t3)}
.wdl-row .num{text-align:right;color:var(--t2);font-variant-numeric:tabular-nums;font-size:12.5px}
.wdl{display:flex;height:14px;gap:2px}
.wdl i{display:block;height:100%;min-width:0}
.wdl i:first-child{border-radius:4px 0 0 4px}.wdl i:last-child{border-radius:0 4px 4px 0}
.wdl i:only-child{border-radius:4px}
.wdl .w{background:var(--win)}.wdl .d{background:var(--draw)}.wdl .l{background:var(--loss)}
.legend{display:flex;gap:14px;color:var(--t2);font-size:12px;margin:2px 0 8px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;padding:3px 0}
.hbar .b{height:12px;border-radius:0 4px 4px 0;background:#3987e5}
.hbar .num{text-align:right;color:var(--t2);font-size:12.5px;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:100;pointer-events:none;background:#0b0b0a;border:1px solid var(--line);color:var(--t1);padding:6px 9px;border-radius:7px;font-size:12.5px;max-width:300px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--t3);font-weight:600;font-size:12px;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid #2a2a26}
tr.click{cursor:pointer} tr.click:hover td{background:var(--s2)}
.res{display:inline-block;width:22px;height:22px;border-radius:6px;text-align:center;line-height:22px;font-weight:800;font-size:12px;color:#fff}
.res.win{background:var(--win)}.res.loss{background:var(--loss)}.res.draw{background:#6a6963}
.cdot{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid #777;vertical-align:-1px}
.cdot.w{background:#f4f4f0}.cdot.b{background:#222}
/* board */
.board{position:relative;width:100%;aspect-ratio:1;user-select:none;touch-action:none;border-radius:4px;overflow:hidden}
.board .sq{position:absolute;width:12.5%;height:12.5%}
.board .sq.l{background:var(--light)}.board .sq.d{background:var(--dark)}
.board .sq.last::after{content:"";position:absolute;inset:0;background:rgba(255,235,59,.42)}
.board .sq.sel::after{content:"";position:absolute;inset:0;background:rgba(20,85,30,.5)}
.board .sq.chk{background:radial-gradient(circle,#ff2a2a 0%,rgba(230,0,0,.6) 40%,rgba(169,0,0,0) 75%)!important}
.board .sq.mk-good::after{content:"";position:absolute;inset:0;background:rgba(40,190,60,.45)}
.board .sq.mk-bad::after{content:"";position:absolute;inset:0;background:rgba(220,40,40,.5)}
.board .sq.mk-hint::after{content:"";position:absolute;inset:0;background:rgba(60,140,240,.5)}
.board .dot{position:absolute;width:12.5%;height:12.5%;pointer-events:none;display:flex;align-items:center;justify-content:center}
.board .dot::before{content:"";width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.22)}
.board .dot.cap::before{width:86%;height:86%;background:none;border:5px solid rgba(0,0,0,.22)}
.board img.pc{position:absolute;width:12.5%;height:12.5%;pointer-events:none;transition:left .12s,top .12s}
.board img.pc.drag{transition:none;z-index:10;transform:scale(1.08)}
.board .coord{position:absolute;font-size:11px;font-weight:700;pointer-events:none}
.board svg.arr{position:absolute;inset:0;pointer-events:none}
.board .badge{position:absolute;width:5.2%;height:5.2%;border-radius:50%;z-index:5;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:min(1.6vw,13px);box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;border:1.5px solid #fff}
.boardwrap{display:flex;gap:8px;align-items:stretch}
.evalbar{width:22px;border-radius:4px;overflow:hidden;background:#3a3a36;position:relative;flex:none}
.evalbar .wfill{position:absolute;left:0;right:0;bottom:0;background:#f1f1ec;transition:height .3s}
.evalbar .txt{position:absolute;left:0;right:0;font-size:10px;font-weight:800;text-align:center}
.plyr{display:flex;align-items:center;gap:8px;padding:6px 2px;font-weight:600}
.plyr .clk{margin-left:auto;background:var(--s2);padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums;color:var(--t2);font-size:13px}
/* review */
.review{display:grid;grid-template-columns:minmax(320px,640px) minmax(320px,1fr);gap:20px;align-items:start}
@media (max-width:900px){.review{grid-template-columns:1fr}}
.moves{max-height:340px;overflow:auto;display:grid;grid-template-columns:40px 1fr 1fr;font-size:13.5px;border:1px solid var(--line);border-radius:8px;background:var(--s2)}
.moves .n{color:var(--t3);padding:4px 8px;background:var(--s1)}
.moves .m{padding:4px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;border-radius:4px}
.moves .m:hover{background:var(--s3)}
.moves .m.cur{background:#4a4a42}
.ic{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;font-size:10px;font-weight:900;color:#fff;flex:none}
.cls-tbl td{padding:4px 6px;border:none;font-variant-numeric:tabular-nums}
.cls-tbl td.c{text-align:center;font-weight:700}
.comment{padding:12px;border-radius:8px;background:var(--s2);border-left:4px solid var(--line);min-height:52px}
.enginelines div{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--t2);padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enginelines b{display:inline-block;min-width:52px;color:var(--t1)}
.graph{width:100%;height:110px;display:block;cursor:pointer;border-radius:8px;background:var(--s2)}
.navbtns{display:flex;gap:6px;margin-top:8px}
.navbtns .btn{flex:1}
.empty{padding:40px;text-align:center;color:var(--t2)}
.hero{max-width:640px;margin:40px auto;text-align:center}
.hero .row{justify-content:center}
.prog{height:8px;background:var(--s3);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.focus{border-left:4px solid var(--c-mistake)}
.focus.hi{border-left-color:var(--c-blunder)}
.focus.ok{border-left-color:var(--win)}
.kpi{font-size:22px;font-weight:800}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--s3);color:var(--t2);font-size:11.5px;margin:2px 3px 2px 0}
.tree-row{display:grid;grid-template-columns:70px 60px 1fr 60px;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.tree-row:hover{background:var(--s2)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;font-size:13px;margin-bottom:8px}
.crumbs span{cursor:pointer;color:#7fb6e8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0b0b0a;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:200}
.status{font-size:15px;font-weight:700;padding:10px 12px;border-radius:8px;background:var(--s2)}
.status.ok{background:rgba(12,163,12,.18);color:#8fe08f}
.status.bad{background:rgba(208,59,59,.2);color:#ff9d9d}
.scroll{max-height:420px;overflow:auto}
.note{font-size:12.5px;color:var(--t3)}
.promo{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;gap:8px;z-index:30}
.promo img{width:18%;background:var(--s3);border-radius:8px;cursor:pointer;padding:4px}
</style></head>

<main></main><div id="tip"></div>

// ===== chart helpers =====
const TC_COLORS = { bullet: '#3987e5', blitz: '#d95926', rapid: '#199e70', daily: '#c98500', unknown: '#9085e9' };
function wdlCount(gs) { const c = { w: 0, d: 0, l: 0, n: gs.length }; for (const g of gs) c[g.result[0]]++; return c; }
function wdlRow(label, gs, sub = '', onclick = '') {
  const c = wdlCount(gs); if (!c.n) return '';
  const score = (c.w + c.d / 2) / c.n * 100;
  const tip = `<b>${esc(label)}</b><br>${c.n} games · score ${score.toFixed(0)}%<br>Won ${c.w} (${pct(c.w, c.n)}%) · Drew ${c.d} (${pct(c.d, c.n)}%) · Lost ${c.l} (${pct(c.l, c.n)}%)`;
  const seg = (k, v) => v ? `<i class="${k}" style="flex:${v}"></i>` : '';
  return `<div class="wdl-row" data-tip="${esc(tip)}" ${onclick ? `style="cursor:pointer" onclick="${onclick}"` : ''}><div class="lab">${esc(label)}${sub ? ` <small>${sub}</small>` : ''}</div><div class="wdl">${seg('w', c.w)}${seg('d', c.d)}${seg('l', c.l)}</div><div class="num">${pct(c.w, c.n)}% <span class="muted">· ${c.n}</span></div></div>`;
}
const WDL_LEGEND = '<div class="legend"><span><b style="background:var(--win)"></b>Win</span><span><b style="background:var(--draw)"></b>Draw</span><span><b style="background:var(--loss)"></b>Loss</span><span class="muted">· right: win % · games</span></div>';
function hbars(rows, color = '#3987e5', fmtv = v => v) {
  const mx = Math.max(1, ...rows.map(r => r[1]));
  return rows.map(([l, v, tip]) => `<div class="hbar" data-tip="${esc(tip || l + ': ' + fmtv(v))}"><div class="t2" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l)}</div><div><div class="b" style="width:${Math.max(1, v / mx * 100)}%;background:${color}"></div></div><div class="num">${fmtv(v)}</div></div>`).join('');
}
// line chart: series [{name,color,pts:[{x,y,tip}]}]
function lineChart(series, { h = 240, yfmt = v => Math.round(v), xfmt = x => fmtDate(x), ymin, ymax } = {}) {
  const id = 'lc' + Math.random().toString(36).slice(2, 8);
  const all = series.flatMap(s => s.pts); if (!all.length) return '<div class="empty">No data</div>';
  let x0 = Math.min(...all.map(p => p.x)), x1 = Math.max(...all.map(p => p.x)); if (x0 === x1) x1 = x0 + 1;
  let y0 = ymin ?? Math.min(...all.map(p => p.y)), y1 = ymax ?? Math.max(...all.map(p => p.y));
  const pad = (y1 - y0) * .08 || 10; if (ymin == null) y0 -= pad; if (ymax == null) y1 += pad;
  const W = 800, H = h, L = 50, R = 10, T = 10, B = 24;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  const ticks = 4; for (let i = 0; i <= ticks; i++) { const v = y0 + (y1 - y0) * i / ticks; g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2f2f2b"/><text x="${L - 6}" y="${Y(v) + 4}" fill="#8f8e86" font-size="14" text-anchor="end">${yfmt(v)}</text>`; }
  for (let i = 0; i <= 4; i++) { const v = x0 + (x1 - x0) * i / 4; g += `<text x="${X(v)}" y="${H - 6}" fill="#8f8e86" font-size="14" text-anchor="${i === 0 ? 'start' : i === 4 ? 'end' : 'middle'}">${xfmt(v)}</text>`; }
  for (const s of series) { if (!s.pts.length) continue; g += `<path d="${s.pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`; }
  const svg = `<svg id="${id}" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}<line class="xh" y1="${T}" y2="${H - B}" stroke="#8f8e86" stroke-dasharray="3 3" style="display:none"/><g class="dots"></g><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/></svg>`;
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return;
    const hit = el.querySelector('.hit'), xh = el.querySelector('.xh'), dots = el.querySelector('.dots'), tip = document.getElementById('tip');
    hit.addEventListener('mousemove', e => {
      const b = el.getBoundingClientRect(); const mx = (e.clientX - b.left) / b.width * W; const xv = x0 + (mx - L) / (W - L - R) * (x1 - x0);
      let html = '', d = '';
      let bx = null;
      for (const s of series) { if (!s.pts.length) continue; let best = s.pts[0]; for (const p of s.pts) if (Math.abs(p.x - xv) < Math.abs(best.x - xv)) best = p; if (bx == null || Math.abs(best.x - xv) < Math.abs(bx - xv)) bx = best.x; }
      for (const s of series) { if (!s.pts.length) continue; let best = s.pts[0]; for (const p of s.pts) if (Math.abs(p.x - xv) < Math.abs(best.x - xv)) best = p; if (Math.abs(best.x - bx) > (x1 - x0) * .03) continue; d += `<circle cx="${X(best.x)}" cy="${Y(best.y)}" r="4.5" fill="${s.color}" stroke="#1c1c1a" stroke-width="2"/>`; html += `<div><b style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${s.color};margin-right:6px"></b>${esc(s.name)}: <b>${yfmt(best.y)}</b>${best.tip ? ' <span style="color:#aaa">' + best.tip + '</span>' : ''}</div>`; }
      xh.setAttribute('x1', X(bx)); xh.setAttribute('x2', X(bx)); xh.style.display = ''; dots.innerHTML = d;
      tip.innerHTML = `<div style="color:#aaa;margin-bottom:3px">${xfmt(bx)}</div>` + html; tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
    });
    hit.addEventListener('mouseleave', () => { xh.style.display = 'none'; dots.innerHTML = ''; tip.style.display = 'none'; });
  });
  const leg = series.length > 1 ? `<div class="legend">${series.map(s => `<span><b style="background:${s.color}"></b>${esc(s.name)}</span>`).join('')}</div>` : '';
  return leg + svg;
}

function analysisAgg(an) {
  const A = { phaseAcc: { open: { s: 0, n: 0 }, mid: { s: 0, n: 0 }, end: { s: 0, n: 0 } }, err: { open: 0, mid: 0, end: 0 }, clsCount: {}, myMoves: 0, winning: { n: 0, won: 0, games: [] }, losing: { n: 0, saved: 0 }, oppBlunders: 0, punished: 0, lowTime: { b: 0, n: 0 }, normalTime: { b: 0, n: 0 }, blunderPiece: {}, missed: 0, games: an.length };
  for (const g of an) {
    const a = S.analysis.get(g.id); const n = a.cls.length; const accM = a.acc[g.color + 'm'] || [];
    let k = 0; let maxW = 0, minW = 100, winPly = -1;
    for (let i = 0; i < n; i++) {
      const mine = (i % 2 === 0) === (g.color === 'w') !== !!(g.startFen && g.startFen.split(' ')[1] === 'b');
      const w = winFor(a.ev[i + 1], g.color);
      if (w > maxW) { maxW = w; if (w >= 85 && winPly < 0) winPly = i; } minW = Math.min(minW, w);
      if (!mine) { if (a.cls[i] === 'blunder' || a.cls[i] === 'mistake') { A.oppBlunders++; if (i + 1 < n && ['best', 'excellent', 'great', 'brilliant', 'good'].includes(a.cls[i + 1]) && winFor(a.ev[i + 2], g.color) >= 60) A.punished++; } continue; }
      const ph = a.phase[i]; const ma = accM[k++]; if (ma != null) { A.phaseAcc[ph].s += ma; A.phaseAcc[ph].n++; }
      const c = a.cls[i]; A.clsCount[c] = (A.clsCount[c] || 0) + 1; A.myMoves++;
      const bad = c === 'mistake' || c === 'blunder' || c === 'miss';
      if (bad) A.err[ph]++;
      if (c === 'miss') A.missed++;
      if (c === 'blunder') { const ch = new Chess(); const p = g.sans[i]; const pc = /^[NBRQK]/.test(p) ? p[0].toLowerCase() : p.startsWith('O-') ? 'k' : 'p'; A.blunderPiece[pc] = (A.blunderPiece[pc] || 0) + 1; }
      const clk = g.clocks && g.clocks[i - 1 >= 0 ? i : i];
      const myClkBefore = i >= 2 ? g.clocks[i - 2] : null;
      if (g.base && myClkBefore != null) { const low = myClkBefore < Math.min(30, g.base * 0.1); const T = low ? A.lowTime : A.normalTime; T.n++; if (c === 'blunder') T.b++; }
    }
    if (maxW >= 85) { A.winning.n++; if (g.result === 'win') A.winning.won++; else A.winning.games.push({ g, ply: winPly }); }
    if (minW <= 15) { A.losing.n++; if (g.result !== 'loss') A.losing.saved++; }
  }
  for (const p of ['open', 'mid', 'end']) A.phaseAcc[p].avg = A.phaseAcc[p].n ? A.phaseAcc[p].s / A.phaseAcc[p].n : 0;
  A.errPerGame = { open: A.err.open / an.length, mid: A.err.mid / an.length, end: A.err.end / an.length };
  A.lowTime.rate = A.lowTime.n ? A.lowTime.b / A.lowTime.n * 100 : 0; A.normalTime.rate = A.normalTime.n ? A.normalTime.b / A.normalTime.n * 100 : 0;
  return A;
}

// ===== live engine helper (foreground engine) =====
const LIVE = { token: 0 };
function liveEval(fen, cb, depth = 20, multipv = 3) {
  const t = ++LIVE.token; ENG_FG.stop();
  setTimeout(() => {
    if (t !== LIVE.token) return;
    const term = terminalEval(fen); if (term) { cb({ lines: [term], depth: 0, fen, terminal: true }); return; }
    ENG_FG.analyze(fen, { depth, multipv, onInfo: c => { if (t === LIVE.token) cb(c); } }).then(c => { if (t === LIVE.token) cb(c, true); });
  }, 140);
}
function liveStop() { LIVE.token++; ENG_FG.stop(); }

    if (!this.vari) this.vari = { base: this.ply, fens: [fen], sans: [], ucis: [], i: 0 };
    const v = this.vari; v.fens = v.fens.slice(0, v.i + 1); v.sans = v.sans.slice(0, v.i); v.ucis = v.ucis.slice(0, v.i);

    const gc = $('#gcur'); if (gc && a) { const x = p / Math.max(1, a.ev.length - 1) * 600; gc.setAttribute('x1', x); gc.setAttribute('x2', x); }

VIEWS.train = {
  show(m) {

  },
  acts: [],

  },
  basicFindings(gs) {
    const out = []; const c = wdlCount(gs); if (!c.n) return out;
    const score = gs2 => { const k = wdlCount(gs2); return k.n ? (k.w + k.d / 2) / k.n * 100 : null; };
    const overall = score(gs);
    const lt = gs.filter(g => g.result === 'loss' && g.how === 'timeout').length;
    if (c.l >= 5) out.push({ sev: lt / c.l > .25 ? .6 : -1, title: lt / c.l > .25 ? 'You lose a lot on time' : 'Clock handling is fine', metric: pct(lt, c.l) + '%', detail: `${lt} of your ${c.l} losses were on time. ${lt / c.l > .25 ? 'Try games with increment (e.g. 10+5 or 15+10), and make quick, simple moves in the opening, saving your time for critical positions.' : ''}` });

  openingFindings(gs, overall, out) {
    for (const col of ['w', 'b']) {
      const mp = {}; for (const g of gs) if (g.color === col) (mp[g.family] = mp[g.family] || []).push(g);
      const rows = Object.entries(mp).filter(([k, v]) => v.length >= 6 && k !== 'Unknown').map(([k, v]) => { const c = wdlCount(v); return [k, v, (c.w + c.d / 2) / c.n * 100]; });
      rows.sort((a, b) => a[2] - b[2]);
      const worst = rows[0];

      const best = rows[rows.length - 1];
      if (best && best[2] > overall + 8 && best[1].length >= 8) out.push({ sev: -1, title: `${best[0]} as ${col === 'w' ? 'White' : 'Black'}`, metric: Math.round(best[2]) + '%', detail: `Your best opening by score (${best[1].length} games). Keep playing it.` });
    }

    if (sw.n > 10 && sb.n > 10) { const a = (sw.w + sw.d / 2) / sw.n * 100, b = (sb.w + sb.d / 2) / sb.n * 100; if (Math.abs(a - b) > 12) { const weakC = a < b ? 'Black' : 'White'; out.push({ sev: Math.min(.7, Math.abs(a - b) / 40), title: `Weaker with ${a < b ? 'White' : 'Black'}`, metric: `${Math.round(Math.min(a, b))}% vs ${Math.round(Math.max(a, b))}%`, detail: `You score ${Math.round(a)}% as White and ${Math.round(b)}% as Black. Your ${a < b ? 'White' : 'Black'} repertoire deserves attention.`, actions: [['Open repertoire', () => go('openings', { color: a < b ? 'w' : 'b' })]] }); } }

    const c = wdlCount(after);
    if (c.n >= 10) { const s = (c.w + c.d / 2) / c.n * 100; out.push(s < overall - 7 ? { sev: Math.min(.8, (overall - s) / 25), title: 'You tilt after losses', metric: Math.round(s) + '%', detail: `Right after a loss you score ${Math.round(s)}%, against ${Math.round(overall)}% normally (${c.n} games). Rule to try: after 2 losses in a row, stop for at least 30 minutes, or go solve puzzles instead.` } : { sev: -1, title: 'You handle losses well', metric: Math.round(s) + '%', detail: `You score about the same right after a loss (${Math.round(s)}%) as normally (${Math.round(overall)}%).` }); }
  },
  findings(gs, an) {

    // tactics

    out.push(pun < 70 || missRate > .4 ? { sev: Math.min(1, (75 - pun) / 40 + missRate / 2), title: 'Missed tactics', metric: Math.round(pun) + '% punished', detail: `When your opponent made a mistake or blunder, you made them pay ${Math.round(pun)}% of the time (${A.punished}/${A.oppBlunders}). That's free points left on the board. There are ${missedPz} puzzles waiting from the exact moments you missed.`, actions: [['Solve my missed tactics', () => go('puzzles', { kind: 'missed' })]] } : { sev: -1, title: 'You punish mistakes', metric: Math.round(pun) + '%', detail: `You punished ${A.punished} of ${A.oppBlunders} opponent mistakes.` });

      accs.sort((a, b) => a[1] - b[1]); const [wp, wv] = accs[0]; const other = accs.slice(1).reduce((s, x) => s + x[1], 0) / (accs.length - 1);
      const acts = wp === 'end' ? [['Endgame puzzles', () => go('puzzles', { theme: 'Endgame' })], ['Play out my endgames', () => this.endgameDrill(an)]] : wp === 'open' ? [['Opening problem spots', () => { VIEWS.openings.tab = 'spots'; go('openings'); }], ['Opening trainer', () => { VIEWS.openings.tab = 'train'; go('openings'); }]] : [['Tactics from my games', () => go('puzzles', { kind: 'missed' })]];
      if (other - wv > 3) out.push({ sev: Math.min(1, (other - wv) / 15), title: `Weakest phase: ${ph[wp]}`, metric: fmt1(wv) + '%', detail: `Your average move accuracy is ${fmt1(wv)}% in the ${ph[wp]} vs ${fmt1(other)}% in the rest of the game. ${wp === 'end' ? 'Endgames reward technique: king activity, passed pawns, and knowing a few key positions.' : wp === 'open' ? 'You lose ground early. Learn your main lines a bit deeper and fix the repeated mistakes.' : 'Middlegames are where tactics live. Check every capture, check and threat before you move.'}`, actions: acts });
      const [bp, bv] = accs[accs.length - 1]; out.push({ sev: -1, title: `Strongest phase: ${ph[bp]}`, metric: fmt1(bv) + '%', detail: `Your most accurate phase.` });

const REP = {
  data: null,
  async load() { this.data = (await DB.get('kv', 'rep')) || { w: this.empty(), b: this.empty() }; this._last = { w: JSON.stringify(this.data.w), b: JSON.stringify(this.data.b) }; return this.data; },
  empty() { return { my: {}, opp: {}, srs: {}, built: 0 }; },
  save() {

    this._last = this._last || {};
    for (const c of ['w', 'b']) { const { mod, ...rest } = this.data[c]; const j = JSON.stringify(rest); if (this._last[c] !== j) { this.data[c].mod = Date.now(); this._last[c] = j; } }

  c(color) { return this.data[color]; }
};
const pk = path => path.join(' ');

function repAutoBuild(color, maxPly = 18) {
  const R = REP.empty(); const old = REP.c(color);

  // best-first: always expand the position you reach most often, so common lines get covered before rare ones
  const heap = [{ path: [], here: gs }];

    heap.sort((x, y) => y.here.length - x.here.length);

    const n = path.length; if (n >= maxPly) continue;
    const key = pk(path); const cnt = {};
    for (const g of here) { const s = g.sans[n]; if (s) cnt[s] = (cnt[s] || 0) + 1; }
    const bn = bookNode(path);
    const bookTop = k => bn ? Object.entries(bn).sort((a, b) => subtreeSize(b[1][1]) - subtreeSize(a[1][1])).slice(0, k).map(x => x[0]) : [];
    if (myTurnAt(color, n)) {
      let san = Object.entries(cnt).sort((a, b) => b[1] - a[1]).find(([s, c]) => c >= 2)?.[0];
      if (san) {
        const an = here.filter(g => g.sans[n] === san && isAnalysed(g.id)); let loss = 0; const bests = {};
        for (const g of an) { const a = S.analysis.get(g.id); loss += a.loss[n] || 0; const b = a.best[n]; if (b) bests[b] = (bests[b] || 0) + 1; }
        if (an.length >= 2 && loss / an.length >= 0.07) {
          const bu = Object.entries(bests).sort((a, b) => b[1] - a[1])[0]; const bs = bu && uciToSan(fenAfter(path), bu[0]);

      R.my[key] = san; myN++;
      heap.push({ path: [...path, san], here: here.filter(g => g.sans[n] === san) });
    } else {
      let reps = Object.entries(cnt).filter(([s, c]) => c >= Math.max(2, here.length * 0.02)).sort((a, b) => b[1] - a[1]).slice(0, n < 2 ? 7 : 5).map(x => x[0]);
      if (!reps.length && n < 12) reps = bookTop(here.length ? 1 : 2);
      if (!reps.length) continue;

    }
  }

}
function repLines(color) {
  const R = REP.c(color); const out = [];
  const rec = (path) => {

    const key = pk(path);

    else { const rs = R.opp[key] || []; if (!rs.length) { out.push(path); return; } for (const r of rs) rec([...path, r]); }

  for (let i = 0; i < Math.min(g.sans.length, 40); i++) {
    const key = pk(g.sans.slice(0, i));
    if (myTurnAt(g.color, i)) { const m = R.my[key]; if (!m) return { ply: i, type: 'end' }; if (g.sans[i] !== m) return { ply: i, type: 'me', played: g.sans[i], expected: m }; }

  }
  return { ply: Math.min(g.sans.length, 40), type: 'end' };
}

    for (const [key, reps] of Object.entries(R.opp)) for (const r of reps) { const k = key ? key + ' ' + r : r; if (!R.my[k] && k.split(' ').length < 14) { const c = gs.filter(g => k.split(' ').every((s, i) => g.sans[i] === s)).length; if (c >= 2) out.push({ path: k.split(' '), n: c, mine: true }); } }
    return out.sort((a, b) => b.n - a.n);
  },
  async build(col) {

    toast(`Built: ${repCards(col).length} moves in ${repLines(col).length} lines${fixes.length ? `, ${fixes.length} of your moves replaced by better ones` : ''}${an < 20 ? ' · analyze more games for better engine fixes' : ''}`, 5000);
  },
  // ---------- edit tree ----------
  edit(el) {
    const col = this.color;
    el.innerHTML = `<div class="review"><div><div id="rpb"></div><div class="navbtns"><button class="btn" id="rpback">◀ Back</button><button class="btn" id="rproot">Start</button></div></div>
      <div class="grid" style="gap:12px"><div class="card"><div class="crumbs" id="rpcr"></div><div id="rpnode"></div></div>
      <div class="card" style="padding:10px 14px"><h3>Engine</h3><div class="enginelines" id="rpeng"></div></div></div></div>`;
    this.eb = new Board($('#rpb'), { orient: col, canMove: () => true, onMove: u => this.editMove(u) });
    $('#rpback').onclick = () => { this.path = this.path.slice(0, -1); this.drawEdit(); };
    $('#rproot').onclick = () => { this.path = []; this.drawEdit(); };

  },
  async editMove(u) {
    const col = this.color, R = REP.c(col); const ch = new Chess(fenAfter(this.path)); const m = moveUci(ch, u); if (!m) return false;
    const key = pk(this.path);
    if (myTurnAt(col, this.path.length)) { if (R.my[key] && R.my[key] !== m.san) { const old = key ? key + ' ' + R.my[key] : R.my[key]; repRemoveBelow(R, old); delete R.my[old]; delete R.opp[old]; } R.my[key] = m.san; delete R.srs[key]; }
    else { R.opp[key] = R.opp[key] || []; if (!R.opp[key].includes(m.san)) R.opp[key].push(m.san); }
    await REP.save(); this.path = [...this.path, m.san]; this.drawEdit();
  },
  drawEdit() {
    const col = this.color, R = REP.c(col), path = this.path, key = pk(path), n = path.length; const fen = fenAfter(path);
    let lastU = null; if (n) { const c = new Chess(fenAfter(path.slice(0, -1))); const mm = c.move(path[n - 1]); lastU = mm && uciOf(mm); }
    const mine = myTurnAt(col, n);
    const arrows = [];
    if (mine && R.my[key]) { const c = new Chess(fen); const mm = c.move(R.my[key]); if (mm) arrows.push({ u: uciOf(mm), color: '#5fb03c' }); }
    if (!mine) for (const r of R.opp[key] || []) { const c = new Chess(fen); const mm = c.move(r); if (mm) arrows.push({ u: uciOf(mm), color: '#d95926', op: .6 }); }
    this.eb.orient = col; this.eb.set(fen, { last: lastU, arrows });
    $('#rpcr').innerHTML = `<span data-i="0">Start</span>` + path.map((s, i) => ` <span data-i="${i + 1}">${i % 2 === 0 ? (i / 2 + 1) + '.' : ''}${esc(s)}</span>`).join('');
    $$('#rpcr span').forEach(sp => sp.onclick = () => { this.path = path.slice(0, +sp.dataset.i); this.drawEdit(); });
    const gs = scoped().filter(g => g.color === col && path.every((s, i) => g.sans[i] === s)); const cnt = {};
    for (const g of gs) if (g.sans[n]) (cnt[g.sans[n]] = cnt[g.sans[n]] || []).push(g);
    const bn = bookNode(path) || {}; const bw = bookWalk(path);

        ${Object.keys(bn).filter(s => !cnt[s]).length ? `<div class="note" style="margin-top:6px">Book moves: ${Object.keys(bn).filter(s => !cnt[s]).slice(0, 10).map(s => `<a href="#" data-pick="${esc(s)}">${esc(s)}</a>`).join(', ')}</div>` : ''}

    } else {
      const reps = R.opp[key] || [];
      h += `<h3 style="margin-top:8px">Opponent replies you've prepared</h3>${reps.map(r => `<div class="row" style="padding:3px 0"><a href="#" data-goto="${esc(r)}"><b>${esc(r)}</b></a><span class="muted">${cnt[r] ? cnt[r].length + '× vs you' : bn[r] ? 'book' : ''}</span><span class="sp"></span><button class="btn sm" data-rm="${esc(r)}">Remove</button></div>`).join('') || '<div class="t2">None yet. Play a reply on the board to add it.</div>'}
        <h3 style="margin-top:14px">What opponents played vs you</h3>${WDL_LEGEND}${Object.entries(cnt).sort((a, b) => b[1].length - a[1].length).map(([s, l]) => `<div data-add="${esc(s)}" style="cursor:pointer">${wdlRow(s, l, reps.includes(s) ? '✓ prepared' : '<span style="color:var(--c-inaccuracy)">not prepared</span>')}</div>`).join('') || '<div class="muted">No games from this position.</div>'}
        <div class="note" style="margin-top:6px">Click a reply (or play it on the board) to add it.</div>`;
    }

    const pick = async s => { const c = new Chess(fen); const mm = c.move(s); if (mm) await this.editMove(uciOf(mm)); };
    $$('[data-pick]').forEach(d => d.onclick = e => { e.preventDefault(); pick(d.dataset.pick); });
    $$('[data-add]').forEach(d => d.onclick = () => pick(d.dataset.add));
    $$('[data-goto]').forEach(d => d.onclick = e => { e.preventDefault(); this.path = [...path, d.dataset.goto]; this.drawEdit(); });
    $$('[data-rm]').forEach(d => d.onclick = async () => { const r = d.dataset.rm; R.opp[key] = (R.opp[key] || []).filter(x => x !== r); const k = key ? key + ' ' + r : r; repRemoveBelow(R, k); delete R.my[k]; delete R.srs[k]; await REP.save(); this.drawEdit(); });
    const gb = $('#rpgo'); if (gb) gb.onclick = () => { this.path = [...path, R.my[key]]; this.drawEdit(); };
    const db = $('#rpdel'); if (db) db.onclick = async () => { const k = key ? key + ' ' + R.my[key] : R.my[key]; repRemoveBelow(R, k); delete R.opp[k]; delete R.my[key]; delete R.srs[key]; await REP.save(); this.drawEdit(); };
    $('#rpeng').innerHTML = '<div class="muted">Thinking…</div>';

  },
  // ---------- drill ----------
  startDrill(mode) { this.drillMode = mode; this.tab = 'drill'; render(); },
  drill(el) {
    const col = this.color; const R = REP.c(col);
    if (!repCards(col).length) { el.innerHTML = '<div class="card empty">Build or create a repertoire first (Overview tab).</div>'; return; }
    const mode = this.drillMode || (repDue(col).length ? 'due' : 'new'); this.drillMode = null;
    const now = Date.now(); const lines = repLines(col);
    const cardsOf = l => l.map((_, i) => i).filter(i => myTurnAt(col, i)).map(i => pk(l.slice(0, i)));
    let pickFn;
    if (mode === 'due') pickFn = l => cardsOf(l).filter(k => R.srs[k] && R.srs[k].due <= now).length;
    else if (mode === 'new') pickFn = l => cardsOf(l).filter(k => !R.srs[k]).length;
    else pickFn = () => 1;
    let q = lines.map(l => ({ l, s: pickFn(l) + Math.random() * .5 })).filter(x => x.s >= 1).sort((a, b) => b.s - a.s).map(x => x.l);
    if (mode === 'new') { const out = []; let nn = 0; const seen = new Set(); for (const l of q) { const fresh = cardsOf(l).filter(k => !R.srs[k] && !seen.has(k)); if (!fresh.length) continue; fresh.forEach(k => seen.add(k)); out.push(l); nn += fresh.length; if (nn >= 8) break; } q = out; }
    else if (mode === 'due') { const out = []; const seen = new Set(); for (const l of q) { const d = cardsOf(l).filter(k => R.srs[k] && R.srs[k].due <= now && !seen.has(k)); if (!d.length) continue; d.forEach(k => seen.add(k)); out.push(l); } q = out; }
    else q = q.slice(0, 10);

      <div class="grid" style="gap:12px"><div class="status" id="drst"></div><div class="card" id="drinfo"></div><div class="prog"><i id="drprog" style="width:0"></i></div></div></div>`;
    this.db = new Board($('#drb'), { orient: col, canMove: c => this.dl && !this.dwait && c === col, onMove: u => this.drillMove(u) });
    $('#drhint').onclick = () => this.drillHint(true);
    $('#drskip').onclick = () => this.nextLine();
    this.total = q.length;
    if (!q.length) { this.dst('ok', mode === 'due' ? 'Nothing due right now. Come back later, or learn new moves.' : 'Nothing new to learn. Nice!'); return; }
    this.nextLine();
  },
  nextLine() {
    clearTimeout(this.t);
    const l = this.dq.shift(); const col = this.color;
    $('#drprog').style.width = pct(this.total - this.dq.length - (l ? 1 : 0), this.total) + '%';
    if (!l) { this.dl = null; const s = this.dstats; this.dst('ok', `✓ Session done: ${s.ok} correct, ${s.bad} wrong${s.learned ? `, ${s.learned} new moves learned` : ''}.`); $('#drinfo').innerHTML = `<div class="row"><button class="btn primary" onclick="VIEWS.rep.tab='home';render()">Back to overview</button><button class="btn" onclick="VIEWS.rep.startDrill('all')">Practice more</button></div>`; REP.save(); return; }
    this.dl = l; this.di = 0; this.dmiss = false;
    const bw = bookWalk(l);
    $('#drt').innerHTML = `<b>${esc(bw.name != null ? BOOKNAME(bw.name).name : 'Your line')}</b><span class="sp"></span><span class="note">${this.dq.length} line${this.dq.length === 1 ? '' : 's'} left</span>`;
    $('#drinfo').innerHTML = `<div class="note">Line: ${esc(pvShort(l))}</div>`;

  },
  step() {
    const l = this.dl, col = this.color, R = REP.c(col);
    if (this.di >= l.length) { SND.play('correct'); this.dst('ok', '✓ Line complete'); this.dwait = true; this.t = setTimeout(() => { this.dwait = false; this.nextLine(); }, 700); return; }
    const fen = fenAfter(l.slice(0, this.di));
    if (myTurnAt(col, this.di)) {
      const key = pk(l.slice(0, this.di)); const s = R.srs[key]; this.dmiss = false;
      if (!s) { this.dnew = true; this.drillHint(false); this.dst('', `New move: <b>${esc(l[this.di])}</b>. Play it on the board.`); }
      else { this.dnew = false; this.dst('', 'Your move'); }
      return;
    }
    this.dwait = true;
    this.t = setTimeout(() => { const c = new Chess(fen); const mm = c.move(l[this.di]); this.di++; this.db.set(c.fen(), { last: mm && uciOf(mm) }); this.dwait = false; this.step(); }, 380);
  },
  drillMove(u) {
    const l = this.dl, col = this.color, R = REP.c(col); const fen = fenAfter(l.slice(0, this.di)); const c = new Chess(fen); const m = moveUci(c, u); if (!m) return false;
    const key = pk(l.slice(0, this.di)); const exp = l[this.di];
    if (m.san === exp) {
      const s = R.srs[key];
      if (!s) { R.srs[key] = { ivl: 1, due: Date.now() + DAY, reps: 1, lapses: 0 }; this.dstats.learned++; }
      else if (this.dmiss) { s.ivl = 1; s.due = Date.now() + DAY; s.lapses++; }
      else { s.ivl = Math.min(180, Math.max(3, s.ivl * 2.5)); s.due = Date.now() + s.ivl * DAY; s.reps++; this.dstats.ok++; }
      this.di++; this.db.set(c.fen(), { last: u, marks: { [m.to]: 'good' } }); this.dst('ok', `✓ ${esc(m.san)}`); REP.save();

    }

    this.db.set(c.fen(), { last: u, marks: { [m.to]: 'bad' } }); this.dwait = true; setTimeout(() => SND.play('wrong'), 120);
    this.dst('bad', `✗ ${esc(m.san)} isn't your prepared move. Try again${this.dmiss ? ', or press Show move' : ''}.`);
    this.t = setTimeout(() => { this.dwait = false; this.db.set(fen, { last: this.lastU() }); }, 800);
  },
  lastU() { if (!this.di) return null; const c = new Chess(fenAfter(this.dl.slice(0, this.di - 1))); const mm = c.move(this.dl[this.di - 1]); return mm && uciOf(mm); },
  drillHint(count) {
    const l = this.dl; if (!l || this.di >= l.length || !myTurnAt(this.color, this.di)) return;

    const fen = fenAfter(l.slice(0, this.di)); const c = new Chess(fen); const mm = c.move(l[this.di]);

  },
  dst(c, h) { const s = $('#drst'); if (s) { s.className = 'status ' + c; s.innerHTML = h; } },
  // ---------- games vs repertoire ----------
  games(el) {
    const col = this.color; const gs = scoped().filter(g => g.color === col).slice(0, 100);

      ${rows.map(({ g, d }, i) => `<tr><td><span class="res ${g.result}">${g.result === 'win' ? 'W' : g.result === 'loss' ? 'L' : '½'}</span></td><td>${fmtDate(g.end)}</td><td>${esc(g.opp.name)} <span class="muted">(${g.opp.rating || '?'})</span></td>

    $$('[data-rv]', el).forEach(b => b.onclick = () => { const x = rows[+b.dataset.rv]; go('review', { id: x.g.id, ply: x.d.ply + 1 }); });
    $$('[data-add]', el).forEach(b => b.onclick = () => { const x = rows[+b.dataset.add]; const R = REP.c(col); R.opp[x.d.key] = R.opp[x.d.key] || []; if (!R.opp[x.d.key].includes(x.d.played)) R.opp[x.d.key].push(x.d.played); REP.save(); this.tab = 'edit'; this.path = x.g.sans.slice(0, x.d.ply + 1); render(); });
  }
};

// ===== Highlights: every brilliant / great / blunder ... across analysed games =====
function miniBoard(fen, { orient = 'w', last, cls, to } = {}) {
  const B = new Chess(fen).board(); let h = '';
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const r = orient === 'w' ? y : 7 - y, f = orient === 'w' ? x : 7 - x; const sq = FILES[f] + (8 - r); const p = B[r][f];
    const lt = last && (last.slice(0, 2) === sq || last.slice(2, 4) === sq);
    h += `<div style="position:absolute;left:${x * 12.5}%;top:${y * 12.5}%;width:12.5%;height:12.5%;background:${(x + y) % 2 ? 'var(--dark)' : 'var(--light)'}">${lt ? '<div style="position:absolute;inset:0;background:rgba(255,235,59,.42)"></div>' : ''}${p ? `<img src="${PIECES[p.color + p.type.toUpperCase()]}" style="position:absolute;inset:0;width:100%;height:100%">` : ''}${cls && sq === to ? `<div style="position:absolute;right:-6%;top:-6%;width:52%;height:52%;border-radius:50%;background:${clsColor(cls)};border:1.5px solid #fff;color:#fff;font-weight:900;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:2">${CLS[cls].sym}</div>` : ''}</div>`;
  }
  return `<div style="position:relative;width:100%;aspect-ratio:1;border-radius:4px;overflow:hidden">${h}</div>`;
}
VIEWS.highlights = {
  cls: 'brilliant', who: 'me', page: 0,
  collect() {

        if (!fens) ({ fens, moves } = replay(g));
        out.push({ g, i, fen: fens[i + 1], mv: moves[i], ev: a.ev[i + 1], best: a.best[i], before: fens[i] });
      });

  },

    const items = this.collect(); const per = 24; const pages = Math.max(1, Math.ceil(items.length / per)); this.page = Math.min(this.page, pages - 1);
    m.innerHTML = '';
    m.appendChild(filtersBar(() => render()));
    const box = document.createElement('div'); m.appendChild(box);
    box.innerHTML = `<div class="filters" style="margin-top:-4px"><div><label>Move</label><span class="chips">${['brilliant', 'great', 'best', 'miss', 'mistake', 'blunder'].map(c => `<span class="chip ${this.cls === c ? 'on' : ''}" data-cls="${c}">${icon(c)} ${c === 'miss' ? 'Misses' : CLS[c].name + 's'} <span style="opacity:.7">${counts[c] || 0}</span></span>`).join('')}</span></div>
        <div><label>By</label><span class="chips"><span class="chip ${this.who === 'me' ? 'on' : ''}" data-who="me">Me</span><span class="chip ${this.who === 'opp' ? 'on' : ''}" data-who="opp">My opponents</span></span></div></div>
      <div class="row" style="margin-bottom:10px"><span class="t2">${items.length} ${CLS[this.cls].name.toLowerCase()} move${items.length === 1 ? '' : 's'} across ${an.length} analyzed games.</span><span class="sp"></span>${an.length < scoped().length ? `<button class="btn sm" onclick="go('games')">Analyze more games to find more</button>` : ''}</div>
      ${items.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${items.slice(this.page * per, this.page * per + per).map((x, k) => `<div class="card" style="padding:10px;cursor:pointer" data-k="${this.page * per + k}">
          ${miniBoard(x.fen, { orient: x.g.color, last: uciOf(x.mv), cls: this.cls, to: x.mv.to })}
          <div class="row" style="margin-top:8px;gap:6px">${icon(this.cls)}<b>${Math.floor(x.i / 2) + 1}${x.i % 2 ? '...' : '.'} ${esc(x.mv.san)}</b><span class="sp"></span><span class="note">${evalText(x.ev)}</span></div>
          <div class="note">vs ${esc(x.g.opp.name)} · ${fmtDate(x.g.end)} · <span class="res ${x.g.result}" style="width:16px;height:16px;line-height:16px;font-size:10px">${x.g.result === 'win' ? 'W' : x.g.result === 'loss' ? 'L' : '½'}</span></div>
          ${['miss', 'mistake', 'blunder'].includes(this.cls) && x.best ? `<div class="note">Best was <b style="color:var(--c-best)">${esc(uciToSan(x.before, x.best))}</b></div>` : ''}</div>`).join('')}</div>` : `<div class="card empty">No ${CLS[this.cls].name.toLowerCase()} moves yet${an.length ? ' in your analyzed games' : '. Analyze some games first'}.</div>`}
      <div class="row" style="margin-top:12px;justify-content:center">${pages > 1 ? `<button class="btn sm" id="hp" ${this.page ? '' : 'disabled'}>← Prev</button><span class="muted">Page ${this.page + 1} of ${pages}</span><button class="btn sm" id="hn" ${this.page < pages - 1 ? '' : 'disabled'}>Next →</button>` : ''}</div>`;
    $$('[data-cls]', box).forEach(c => c.onclick = () => { this.cls = c.dataset.cls; this.page = 0; render(); });
    $$('[data-who]', box).forEach(c => c.onclick = () => { this.who = c.dataset.who; this.page = 0; render(); });
    $$('[data-k]', box).forEach(c => c.onclick = () => { const x = items[+c.dataset.k]; go('review', { id: x.g.id, ply: x.i + 1 }); });
    const hp = $('#hp'), hn = $('#hn'); if (hp) hp.onclick = () => { this.page--; render(); }; if (hn) hn.onclick = () => { this.page++; render(); };
  },
  onAnalysed() { if (!_refreshT) _refreshT = setTimeout(() => { _refreshT = null; if (CURVIEW === 'highlights') render(); }, 4000); }
};

// ===== backup / restore =====
async function exportBackup() {
  const data = { app: 'chesslab', v: 1, at: Date.now() };
  for (const s of DB.stores) data[s] = await DB.all(s);
  let blob = new Blob([JSON.stringify(data)], { type: 'application/json' }); let ext = 'json';
  if (window.CompressionStream) { blob = await new Response(blob.stream().pipeThrough(new CompressionStream('gzip'))).blob(); ext = 'json.gz'; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `chesslab-backup-${new Date().toISOString().slice(0, 10)}.${ext}`; document.body.appendChild(a); a.click(); a.remove();
  await DB.put('kv', 'lastBackup', Date.now());
  return blob.size;
}
async function importBackup(file) {
  let text;
  if (file.name.endsWith('.gz')) text = await new Response(file.stream().pipeThrough(new DecompressionStream('gzip'))).text(); else text = await file.text();
  const data = JSON.parse(text); if (data.app !== 'chesslab') throw new Error('Not a ChessLab backup file');
  for (const s of DB.stores) if (data[s]) await DB.putMany(s, data[s]);
  return data;
}
async function protectStorage() {
  try { if (navigator.storage && navigator.storage.persist) { const already = await navigator.storage.persisted(); return already || await navigator.storage.persist(); } } catch (e) { }
  return false;
}

// ===== Cloud sync via a private GitHub Gist =====
// What syncs: analyses, puzzles (+ your progress on them), repertoire + drill progress, settings, practice rating.
// Games themselves are re-imported from chess.com on a new device (automatic after the first sync).
const SYNC = {
  NB: 32, DESC: 'ChessLab sync (managed by the app, do not edit)',
  dirty: new Set(), busy: false, timer: null, status: '', login: '',
  token() { try { return localStorage.getItem('cl_gh_token') || ''; } catch (e) { return ''; } },
  gist() { try { return localStorage.getItem('cl_gist_id') || ''; } catch (e) { return ''; } },
  on() { return !!(this.token() && this.gist()); },
  async api(path, opts = {}) {
    const r = await fetch('https://api.github.com' + path, { ...opts, cache: 'no-store', headers: { Authorization: 'Bearer ' + this.token(), Accept: 'application/vnd.github+json', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (r.status === 401) throw new Error('GitHub rejected the token (expired or revoked). Reconnect in Settings.');
    if (!r.ok) throw new Error('GitHub error ' + r.status);
    return r.status === 204 ? null : r.json();
  },
  bucket(id) { let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0; return Math.abs(h) % this.NB; },
  async enc(obj) {
    const gz = await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    const u = new Uint8Array(gz); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  },
  async dec(b64) {
    const bin = atob(b64.trim()); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  },
  // called by DB.put / putMany: remember what changed so only that is uploaded
  touch(store, key) {
    if (this.applying) return;
    if (store === 'analysis') this.dirty.add('a' + this.bucket(String(key)));
    else if (store === 'puzzles') this.dirty.add('p' + this.bucket(String(key)) % 4);
    else if (store === 'kv' && ['rep', 'prating', 'settings', 'user'].includes(key)) { this.dirty.add('meta'); DB._raw('kv', 'metaMod', Date.now()); }
    else return;
    this.schedule();
  },
  schedule(ms = 20000) { if (!this.on()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push().catch(e => this.fail(e)), ms); },
  setStatus(s) { this.status = s; const el = $('#syncst'); if (el) el.innerHTML = s; const hd = $('#syncdot'); if (hd) { hd.textContent = this.on() ? (this.busy ? '☁ syncing…' : '☁ synced') : ''; hd.title = s.replace(/<[^>]+>/g, ''); } },
  fail(e) { console.error(e); this.busy = false; this.setStatus('⚠ ' + esc(e.message)); },
  async connect(token) {
    localStorage.setItem('cl_gh_token', token.trim());
    const me = await this.api('/user'); this.login = me.login; localStorage.setItem('cl_gh_login', me.login);
    let id = '';
    for (let page = 1; page <= 5 && !id; page++) { const list = await this.api(`/gists?per_page=100&page=${page}`); const g = list.find(x => x.description === this.DESC); if (g) id = g.id; if (list.length < 100) break; }
    if (!id) { const g = await this.api('/gists', { method: 'POST', body: JSON.stringify({ description: this.DESC, public: false, files: { 'README.md': { content: 'Private backup of ChessLab progress (analyses, puzzles, repertoire).\nManaged automatically by https://darthpotter007.github.io/chesslab/ — please do not edit.' } } }) }); id = g.id; }
    localStorage.setItem('cl_gist_id', id);
    return this.sync(true);
  },
  disconnect() { localStorage.removeItem('cl_gh_token'); localStorage.removeItem('cl_gist_id'); this.setStatus('Not connected'); },
  async readFiles() {
    const g = await this.api('/gists/' + this.gist()); const out = {};
    for (const [name, f] of Object.entries(g.files)) {
      if (!name.endsWith('.b64')) continue;
      let c = f.content; if (f.truncated) c = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
      out[name.replace('.b64', '')] = c;
    }
    return out;
  },
  // pull remote, merge record by record (newest wins), then push whatever is newer here
  async sync(first = false) {
    if (!this.on() || this.busy) return; this.busy = true; this.setStatus('Syncing…');
    try {
      const files = await this.readFiles(); let got = 0; this.applying = true;
      // analyses
      for (let b = 0; b < this.NB; b++) {
        const key = 'a' + b; const remote = files[key] ? await this.dec(files[key]) : {};
        const local = [...S.analysis.entries()].filter(([id]) => this.bucket(id) === b);
        const put = [];
        for (const [id, a] of Object.entries(remote)) { const l = S.analysis.get(id); if (!l || (a.at || 0) > (l.at || 0)) { S.analysis.set(id, a); put.push([id, a]); got++; } }
        if (put.length) await DB.putMany('analysis', put);
        if (local.some(([id, a]) => !remote[id] || (a.at || 0) > (remote[id].at || 0))) this.dirty.add(key);
      }
      // puzzles
      for (let b = 0; b < 4; b++) {
        const key = 'p' + b; const remote = files[key] ? await this.dec(files[key]) : {};
        const ts = p => Math.max(p.last || 0, p.created || 0);
        const put = [];
        for (const [id, p] of Object.entries(remote)) { const l = S.puzzles.get(id); if (!l || ts(p) > ts(l)) { S.puzzles.set(id, p); put.push([id, p]); got++; } }
        if (put.length) await DB.putMany('puzzles', put);
        if ([...S.puzzles.entries()].some(([id, p]) => this.bucket(id) % 4 === b && (!remote[id] || ts(p) > ts(remote[id])))) this.dirty.add(key);
      }
      // meta: settings, practice rating, repertoire (per colour, newest wins), username
      if (files.meta) {
        const m = await this.dec(files.meta); const myMod = (await DB.get('kv', 'metaMod')) || 0;
        const rep = (await DB.get('kv', 'rep')) || { w: REP.empty(), b: REP.empty() };
        let repChanged = false;
        for (const c of ['w', 'b']) if (m.rep && m.rep[c] && (m.rep[c].mod || m.rep[c].built || 0) > (rep[c].mod || rep[c].built || 0)) { rep[c] = m.rep[c]; repChanged = true; }
        if (repChanged) { await DB.put('kv', 'rep', rep); REP.data = rep; got++; }
        if ((m.mod || 0) > myMod) {
          if (m.settings) { S.settings = m.settings; await DB.put('kv', 'settings', m.settings); }
          if (m.prating) await DB.put('kv', 'prating', m.prating);
          if (m.user && !S.user) { S.user = m.user; await DB.put('kv', 'user', m.user); }
          await DB.put('kv', 'metaMod', m.mod); got++;
        } else if (myMod > (m.mod || 0)) this.dirty.add('meta');
        for (const c of ['w', 'b']) if ((rep[c].mod || rep[c].built || 0) > ((m.rep && m.rep[c] && (m.rep[c].mod || m.rep[c].built)) || 0)) this.dirty.add('meta');
      } else this.dirty.add('meta');
      this.applying = false;
      if (got) { recalib(); userHdr(); }
      await this.push(true);
      await DB.put('kv', 'syncAt', Date.now());
      this.setStatus(`✓ Synced ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}${got ? ` · ${got} update${got === 1 ? '' : 's'} pulled from the cloud` : ''}`);
      // brand-new device: fetch the games too
      if (first && S.user && !S.games.length) { this.setStatus('✓ Synced. Importing your games from chess.com…'); try { await importChessCom(S.user, () => { }); rebuildGames(); userHdr(); } catch (e) { } this.setStatus('✓ Synced, games imported'); }
      if (got && VIEWS[CURVIEW] && CURVIEW !== 'review' && CURVIEW !== 'play') render();
    } catch (e) { this.applying = false; this.fail(e); }
    this.busy = false; this.setStatus(this.status);
  },
  async push(inSync = false) {
    if (!this.on() || (!inSync && this.busy) || !this.dirty.size) return;
    if (!inSync) { this.busy = true; this.setStatus('Uploading…'); }
    try {
      const keys = [...this.dirty]; this.dirty.clear(); const files = {};
      for (const k of keys) {
        let obj;
        if (k === 'meta') { const rep = (await DB.get('kv', 'rep')) || null; obj = { v: 1, mod: (await DB.get('kv', 'metaMod')) || Date.now(), user: S.user, settings: S.settings, prating: await DB.get('kv', 'prating'), rep }; }
        else if (k[0] === 'a') { const b = +k.slice(1); obj = {}; for (const [id, a] of S.analysis) if (this.bucket(id) === b) obj[id] = a; }
        else { const b = +k.slice(1); obj = {}; for (const [id, p] of S.puzzles) if (this.bucket(id) % 4 === b) obj[id] = p; }
        files[k + '.b64'] = { content: await this.enc(obj) };
      }
      // GitHub limits request size: send in batches
      const names = Object.keys(files); let batch = {}, size = 0;
      const send = async () => { if (!Object.keys(batch).length) return; await this.api('/gists/' + this.gist(), { method: 'PATCH', body: JSON.stringify({ files: batch }) }); batch = {}; size = 0; };
      for (const n of names) { batch[n] = files[n]; size += files[n].content.length; if (size > 3e6) await send(); }
      await send();
      if (!inSync) { this.busy = false; this.setStatus(`✓ Synced ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`); }
    } catch (e) { if (!inSync) this.fail(e); else throw e; }
  },
  start() {
    if (!this.on()) return;
    this.login = localStorage.getItem('cl_gh_login') || '';
    this.sync();
    setInterval(() => { if (this.dirty.size) this.push().catch(e => this.fail(e)); }, 180000);
    let lastPull = Date.now();
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (this.dirty.size) this.push().catch(e => this.fail(e)); }
      else if (Date.now() - lastPull > 60000) { lastPull = Date.now(); this.sync(); }
    });
  }
};

// ===== boot =====
const DEFAULT_USER = 'darthpotter007';
(async function boot() {
  await DB.open();
  try { const f = JSON.parse(localStorage.getItem('cl_filters') || 'null'); if (f) Object.assign(S.filters, f); } catch (e) { }
  await loadAll();
  $('#sndbox').innerHTML = soundToggleHtml(); wireSoundToggle();
  await REP.load();
  protectStorage();
  userHdr();
  render();
  try { SYNC.start(); } catch (e) { console.error(e); }
  setTimeout(queuePuzzleRefresh, 4000);
  // gentle backup reminder once there is progress worth saving
  setTimeout(async () => { const lb = await DB.get('kv', 'lastBackup'); const hasProgress = S.analysis.size >= 20 || [...S.puzzles.values()].some(p => p.tries);
    if (hasProgress && (!lb || Date.now() - lb > 14 * DAY)) { const d = document.createElement('div'); d.className = 'toast'; d.style.cssText += ';display:flex;gap:12px;align-items:center;bottom:70px'; d.innerHTML = `<span>💾 ${lb ? "It's been a while since your last backup." : 'Back up your progress so it can never get lost.'}</span><button class="btn primary sm">Back up now</button><button class="btn sm">Later</button>`; const [b1, b2] = d.querySelectorAll('button'); b1.onclick = async () => { await exportBackup(); d.remove(); toast('Backup saved to your Downloads'); }; b2.onclick = async () => { await DB.put('kv', 'lastBackup', Date.now() - 7 * DAY); d.remove(); }; document.body.appendChild(d); } }, 8000);
  // warm the engines in the background
  setTimeout(() => { ENG_FG.init().catch(e => console.error(e)); }, 300);
})();

// ===== live-update check (hosted build only) =====
if (typeof BUILD_ID !== 'undefined' && location.protocol.startsWith('http')) {
  const check = async () => {
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); const v = await r.json();
      if (v.build && v.build !== BUILD_ID && !document.getElementById('updbar')) {
        const d = document.createElement('div'); d.id = 'updbar'; d.className = 'toast'; d.style.cssText += ';display:flex;gap:12px;align-items:center';
        d.innerHTML = `<span>✨ A new version of ChessLab is ready${v.note ? ': ' + esc(v.note) : ''}</span><button class="btn primary sm">Reload</button>`;
        d.querySelector('button').onclick = async () => { try { await fetch('index.html', { cache: 'reload' }); } catch (e) { } location.reload(); };
        document.body.appendChild(d);
      }
    } catch (e) { }
  };
  setTimeout(check, 5000); setInterval(check, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
}
